server:
  port: 8099

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://trolley.proxy.rlwy.net:27153/railway?currentSchema=public}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:hbhSmQWhnkxjjUYsegvwbPDBfaOkzHdZ}
    driver-class-name: org.postgresql.Driver


  flyway:
    enabled: true
    default-schema: public
    schemas: public
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true

tawseela:
  jwt:
    secret: ${TAWSEELA_JWT_SECRET:dev-only-change-me-32chars-minimum!!}
    access-expiration-ms: ${TAWSEELA_JWT_ACCESS_MS:900000}
    refresh-expiration-ms: ${TAWSEELA_JWT_REFRESH_MS:1209600000}
  otp:
    ttl-minutes: ${TAWSEELA_OTP_TTL_MINUTES:5}
    max-attempts: ${TAWSEELA_OTP_MAX_ATTEMPTS:5}
    expire-scan-ms: 300000
  sms:
    enabled: ${TAWSEELA_SMS_ENABLED:false}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_PHONE_NUMBER:}
      messaging-service-sid: ${TWILIO_MESSAGING_SERVICE_SID:}
  admin-bootstrap:
    mobile: ${TAWSEELA_ADMIN_MOBILE:admin}
    default-password: ${TAWSEELA_ADMIN_DEFAULT_PASSWORD:ChangeMe1!Strong}

logging:
  level:
    com.tawseela: INFO
